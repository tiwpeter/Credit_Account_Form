name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/CreditAccountApi.csproj

      - name: Build
        run: dotnet build backend/CreditAccountApi.csproj --no-restore -c Release

      # ถ้ามี test project แยก ให้เพิ่ม step test ตรงนี้
      # - name: Test
      #   run: dotnet test <path-to-test-project> -c Release

      - name: Publish API
        run: dotnet publish backend/CreditAccountApi.csproj -c Release -o ./publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ./publish/api

  codegen:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build Api
        run: |
          dotnet restore backend/CreditAccountApi.csproj
          dotnet build backend/CreditAccountApi.csproj --no-restore -c Release

      - name: Install Swashbuckle CLI
        run: dotnet tool install --global Swashbuckle.AspNetCore.Cli --version 6.9.0

      - name: Generate swagger.json (no server needed)
        working-directory: backend
        env:
          ConnectionStrings__myPostgres: "Host=localhost;Database=dummy;Username=dummy;Password=dummy"
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          swagger tofile --output swagger.json bin/Release/net8.0/CreditAccountApi.dll v1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Angular API client
        run: |
          npx --yes @openapitools/openapi-generator-cli generate \
            -i backend/swagger.json \
            -g typescript-angular \
            -o frontend/src/app/core/api-client

      - name: Commit generated client back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/core/api-client
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: auto-generate Angular API client [skip ci]"
          git diff --cached --quiet || git push

  frontend:
    needs: codegen
    if: always() && (needs.codegen.result == 'success' || needs.codegen.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm install
      - run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: frontend/dist

  # ปิดไว้ก่อน เปิดใช้เมื่อมี Dockerfile จริงที่ path backend/Dockerfile และ frontend/Dockerfile
